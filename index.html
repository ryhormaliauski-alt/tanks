<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Pixel Tank Battle</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#101820; }
    body { font-family:'Press Start 2P',monospace; user-select:none; }
    #game-container { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; background:#101820; }
    #game-container canvas { display:block; width:100%; height:100%; }
    #fullscreen { position:fixed; right:14px; bottom:14px; z-index:10; border:1px solid #82909a; border-radius:4px; padding:9px 11px; color:#e2e8f0; background:rgba(10,16,22,.78); font:10px 'Press Start 2P',monospace; cursor:pointer; }
    #fullscreen:hover { background:#334155; }
    #sound-toggle { position:fixed; right:14px; bottom:60px; z-index:10; border:1px solid #82909a; border-radius:4px; padding:9px 11px; color:#e2e8f0; background:rgba(10,16,22,.78); font:10px 'Press Start 2P',monospace; cursor:pointer; }
    #sound-toggle:hover { background:#334155; }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Pixel Tank Battle game"></main>
  <button id="fullscreen" type="button" aria-label="Toggle fullscreen">FULLSCREEN</button>
  <button id="sound-toggle" type="button" aria-label="Turn sound off">SOUND ON</button>
  <script>
    const matchState = { mode:'local', p1Chassis:'medium', p2Chassis:'medium', p1Score:0, p2Score:0, round:1, highestRound:1, currentTheme:'city' };
    const THEMES = {
      city:    { name:'CITY', bg:0x252c30, floor:0x30383a, accent:0x697275, wall:0xa64f3e, light:0xd37a55, dark:0x63392f },
      factory: { name:'FACTORY', bg:0x202a30, floor:0x28353a, accent:0x52656a, wall:0x66777a, light:0xa8b2aa, dark:0x39464a },
      winter:  { name:'WINTER FOREST', bg:0x8299a0, floor:0xb9c8c8, accent:0xe3eeee, wall:0x557d83, light:0x91b5b3, dark:0x315259 },
      desert:  { name:'DESERT', bg:0x9a7047, floor:0xb9905d, accent:0xd1ad75, wall:0x9e6841, light:0xd0a269, dark:0x65452f }
    };
    const CHASSIS_STATS = {
      light:{name:'LIGHT TANK',hp:60,speed:210,turnRate:190,color:0x58b86b,size:29},
      medium:{name:'MEDIUM TANK',hp:100,speed:150,turnRate:140,color:0x428bd0,size:35},
      heavy:{name:'HEAVY TANK',hp:160,speed:95,turnRate:90,color:0xc9574e,size:41}
    };
    const FONT = '"Press Start 2P"';
    // ---------- Visual helpers (canvas-drawn textures, gradients, soft lighting) ----------
    const hexStr=n=>'#'+n.toString(16).padStart(6,'0');
    function shade(n,f){const t=f<0?0:255,k=Math.abs(f),r=n>>16&255,g=n>>8&255,b=n&255;return hexStr((Math.round((t-r)*k+r)<<16)|(Math.round((t-g)*k+g)<<8)|Math.round((t-b)*k+b));}
    function rrect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function makeTex(scene,key,w,h,fn){if(scene.textures.exists(key))scene.textures.remove(key);const t=scene.textures.createCanvas(key,Math.max(1,Math.ceil(w)),Math.max(1,Math.ceil(h)));fn(t.getContext(),t.width,t.height);t.refresh();return t;}
    function blob(ctx,x,y,r,color,alpha){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${color},${alpha})`);g.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
    const rnd=(a,b)=>a+Math.random()*(b-a);

    function poly(ctx,pts){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
    function rivet(ctx,x,y,r=1.2){ctx.fillStyle='rgba(0,0,0,.68)';ctx.beginPath();ctx.arc(x+.35,y+.4,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#aeb8b2';ctx.beginPath();ctx.arc(x,y,r*.85,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(x-r*.25,y-r*.25,r*.35,0,Math.PI*2);ctx.fill();}

    function drawTracks(ctx,x0,x1,ty,th,wheels,grouserStep,isTop){
      const len=x1-x0;
      // drop shadow under track assembly
      ctx.fillStyle='rgba(0,0,0,.42)';rrect(ctx,x0+1,ty+1.5,len,th,th*.4);ctx.fill();
      // metallic rubber-steel track belt
      let g=ctx.createLinearGradient(0,ty,0,ty+th);
      g.addColorStop(0,'#545c58');g.addColorStop(.18,'#353b38');g.addColorStop(.5,'#151917');g.addColorStop(.82,'#282e2b');g.addColorStop(1,'#090b0a');
      ctx.fillStyle=g;rrect(ctx,x0,ty,len,th,th*.38);ctx.fill();
      // drive sprocket & idler teeth at ends
      [x0+th*.38,x1-th*.38].forEach(sx=>{
        const sy=ty+th/2,sr=th*.42;
        ctx.fillStyle='#68726d';
        for(let a=0;a<8;a++){const ang=a*Math.PI/4;ctx.fillRect(sx+Math.cos(ang)*sr-1,sy+Math.sin(ang)*sr-1,2,2);}
      });
      // grouser bars & rubber track pads
      for(let x=x0+2.5;x<x1-2.5;x+=grouserStep){
        ctx.fillStyle='rgba(195,205,198,.32)';ctx.fillRect(x,ty+1,1.1,th-2);
        ctx.fillStyle='rgba(20,24,22,.75)';ctx.fillRect(x+1.1,ty+1.4,grouserStep-1.5,th-2.8);
        ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x+grouserStep-.6,ty+1,0.6,th-2);
      }
      // central guide horn groove
      ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x0+3,ty+th/2-.7,len-6,1.4);
      // road wheels with rubber tires & bolted steel hubs
      for(let i=0;i<wheels;i++){
        const wx=x0+th*.46+i*(len-th*.92)/Math.max(1,wheels-1),wy=ty+th/2,r=th*.39;
        g=ctx.createRadialGradient(wx,wy,0,wx,wy,r);
        g.addColorStop(0,'#464c49');g.addColorStop(.72,'#191d1b');g.addColorStop(1,'#080a09');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(wx,wy,r,0,Math.PI*2);ctx.fill();
        g=ctx.createRadialGradient(wx-.8,wy-.8,0,wx,wy,r*.54);
        g.addColorStop(0,'#b4beb8');g.addColorStop(1,'#3a413e');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(wx,wy,r*.54,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#101412';ctx.beginPath();ctx.arc(wx,wy,r*.2,0,Math.PI*2);ctx.fill();
      }
      ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=1.1;rrect(ctx,x0,ty,len,th,th*.38);ctx.stroke();
    }

    function drawLightTank(ctx,L,c){
      // RECON / SCOUT LIGHT TANK: Sleek pointed pike-nose hull, exposed fast 4-wheel tracks,
      // rear-offset teardrop reconnaissance turret with bustle rack, smoke pods & long needle autocannon
      const cy=L/2,th=Math.round(L*.185),hx0=5,hx1=L-8,hw=hx1-hx0,hullTop=2+th-1,hullH=L-2*hullTop;
      [2,L-2-th].forEach((ty,idx)=>{
        drawTracks(ctx,3,L-9,ty,th,4,3.1,idx===0);
        // lightweight angled front & rear mudguards
        ctx.fillStyle=shade(c,-.32);
        ctx.fillRect(L-15,ty,6,th);ctx.fillRect(3,ty,5,th);
        ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=.8;ctx.strokeRect(L-15,ty,6,th);ctx.strokeRect(3,ty,5,th);
        // inner suspension fender strip
        const fy=idx===0?ty+th-2.4:ty;
        ctx.fillStyle=shade(c,-.42);ctx.fillRect(5,fy,L-16,2.4);
      });

      // Pointed V-bow ("pike nose") reconnaissance hull
      const hPts=[[hx0+3,hullTop],[hx1-8,hullTop],[hx1+2,cy],[hx1-8,hullTop+hullH],[hx0+3,hullTop+hullH],[hx0,cy]];
      let hGrad=ctx.createLinearGradient(0,hullTop,0,hullTop+hullH);
      hGrad.addColorStop(0,shade(c,.38));hGrad.addColorStop(.32,shade(c,.12));hGrad.addColorStop(.52,hexStr(c));hGrad.addColorStop(.85,shade(c,-.35));hGrad.addColorStop(1,shade(c,-.58));
      ctx.fillStyle=hGrad;poly(ctx,hPts);ctx.fill();

      // Diagonal recon camo stripes & pike-nose faceted glacis shading
      ctx.save();poly(ctx,hPts);ctx.clip();
      for(let i=-1;i<5;i++){
        ctx.fillStyle=i%2===0?shade(c,-.45):shade(c,.38);ctx.globalAlpha=.2;
        ctx.beginPath();ctx.moveTo(hx0+i*10,hullTop);ctx.lineTo(hx0+i*10+6,hullTop);ctx.lineTo(hx0+i*10-4,hullTop+hullH);ctx.lineTo(hx0+i*10-10,hullTop+hullH);ctx.closePath();ctx.fill();
      }
      ctx.globalAlpha=1;
      // Upper pike nose highlight facet & lower pike nose shadow facet
      ctx.fillStyle='rgba(255,255,255,.16)';poly(ctx,[[hx1-12,hullTop],[hx1-8,hullTop],[hx1+2,cy],[hx1-12,cy]]);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.24)';poly(ctx,[[hx1-12,cy],[hx1+2,cy],[hx1-8,hullTop+hullH],[hx1-12,hullTop+hullH]]);ctx.fill();
      // Pike-nose center weld ridge
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx1-12,cy);ctx.lineTo(hx1+1.5,cy);ctx.stroke();
      ctx.restore();

      // Forward engine louver grille & driver periscopes
      ctx.fillStyle='rgba(14,18,16,.7)';ctx.fillRect(hx0+3,hullTop+2.5,hw*.22,hullH-5);
      ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=.9;
      for(let y=hullTop+4;y<hullTop+hullH-3.5;y+=2){ctx.beginPath();ctx.moveTo(hx0+4,y);ctx.lineTo(hx0+2+hw*.2,y);ctx.stroke();}
      // Twin rear exhaust mufflers with soot
      [hullTop+1.5,hullTop+hullH-4.5].forEach(ey=>{
        ctx.fillStyle='#2a2623';rrect(ctx,hx0-1,ey,6,3,1);ctx.fill();
        blob(ctx,hx0-1,ey+1.5,4,'15,12,10',.5);
      });
      // Driver vision blocks (cyan-tinted armored glass) at front bow
      [-3,0,3].forEach(dy=>{
        ctx.fillStyle='#0d252c';ctx.fillRect(hx1-10,cy+dy-1,2.2,1.8);
        ctx.fillStyle='#5eead4';ctx.fillRect(hx1-9.6,cy+dy-.7,1.4,1);
      });
      // Headlights on front fenders
      [hullTop+1.5,hullTop+hullH-3.5].forEach(ly=>{
        ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(hx1-6,ly+1,1.4,0,Math.PI*2);ctx.fill();
        blob(ctx,hx1-4,ly+1,4,'255,245,160',.35);
      });

      ctx.strokeStyle=shade(c,-.72);ctx.lineWidth=1.3;poly(ctx,hPts);ctx.stroke();

      // Teardrop / oscillating reconnaissance turret (set slightly rear-center)
      const tcx=L*.41,tr=L*.19;
      ctx.save();ctx.translate(tcx,cy);
      // Turret drop shadow
      ctx.fillStyle='rgba(0,0,0,.46)';
      ctx.beginPath();ctx.moveTo(-tr*1.35+1.5,-tr*.72+2);ctx.lineTo(tr*.75+1.5,-tr*.82+2);ctx.lineTo(tr*1.15+1.5,2);ctx.lineTo(tr*.75+1.5,tr*.82+2);ctx.lineTo(-tr*1.35+1.5,tr*.72+2);ctx.closePath();ctx.fill();

      // Rear turret bustle rack (open mesh storage cage)
      ctx.strokeStyle='#232a27';ctx.lineWidth=1.2;ctx.strokeRect(-tr*1.55,-tr*.55,tr*.4,tr*1.1);
      ctx.fillStyle='#8c7a5b';rrect(ctx,-tr*1.5,-tr*.45,tr*.28,tr*.9,1.5);ctx.fill(); // rolled camo tarp

      // Streamlined swept turret body
      const tPts=[[-tr*1.2,-tr*.68],[tr*.65,-tr*.78],[tr*1.12,-tr*.36],[tr*1.12,tr*.36],[tr*.65,tr*.78],[-tr*1.2,tr*.68]];
      let tGrad=ctx.createRadialGradient(-tr*.15,-tr*.28,tr*.1,0,0,tr*1.3);
      tGrad.addColorStop(0,shade(c,.48));tGrad.addColorStop(.52,shade(c,.06));tGrad.addColorStop(.88,shade(c,-.44));tGrad.addColorStop(1,shade(c,-.68));
      ctx.fillStyle=tGrad;poly(ctx,tPts);ctx.fill();
      ctx.strokeStyle=shade(c,-.78);ctx.lineWidth=1.3;ctx.stroke();

      // Bevel highlight on turret roof
      ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=.9;
      ctx.beginPath();ctx.moveTo(-tr*.95,-tr*.48);ctx.lineTo(tr*.55,-tr*.56);ctx.lineTo(tr*.88,-tr*.22);ctx.stroke();

      // Cheek-mounted 3-tube smoke grenade dischargers
      [-1,1].forEach(sd=>{
        for(let k=0;k<3;k++){
          ctx.fillStyle='#2b3330';ctx.fillRect(tr*.1+k*2.1,sd*(tr*.78)-1,2.2,2);
        }
      });
      ctx.restore();

      // Slender high-velocity rifled autocannon barrel with fluted jacket & slotted flash hider
      const bh=Math.max(3.2,L*.075),bx0=tcx+tr*.95,bx1=L;
      // Fluted recoil jacket at barrel base
      ctx.fillStyle=shade(c,-.48);rrect(ctx,bx0-2,cy-bh*1.05,8,bh*2.1,1.5);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=.9;ctx.stroke();
      // Long needle barrel
      let bGrad=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);
      bGrad.addColorStop(0,'#d0dad4');bGrad.addColorStop(.38,'#7c8780');bGrad.addColorStop(.75,'#353d39');bGrad.addColorStop(1,'#121615');
      ctx.fillStyle=bGrad;ctx.fillRect(bx0+5,cy-bh/2,bx1-bx0-9,bh);
      ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=.7;ctx.strokeRect(bx0+5,cy-bh/2,bx1-bx0-9,bh);
      // Slotted flash suppressor / light muzzle brake
      ctx.fillStyle=bGrad;rrect(ctx,bx1-5.5,cy-bh*.75,5.5,bh*1.5,1.2);ctx.fill();
      ctx.strokeStyle='#101413';ctx.lineWidth=.8;ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(bx1-4,cy-bh*.4,1.2,bh*.8);ctx.fillRect(bx1-2,cy-bh*.4,1.2,bh*.8);

      // Commander hatch & CITV thermal/laser optics pod on turret roof
      let cupG=ctx.createRadialGradient(tcx-tr*.25,cy+tr*.22,0,tcx-tr*.25,cy+tr*.22,tr*.36);
      cupG.addColorStop(0,'#9aa6a0');cupG.addColorStop(1,'#282f2c');
      ctx.fillStyle=cupG;ctx.beginPath();ctx.arc(tcx-tr*.25,cy+tr*.22,tr*.32,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=.9;ctx.stroke();
      // CITV sensor turret with glowing emerald lens
      ctx.fillStyle='#26302d';rrect(ctx,tcx-tr*.2,cy-tr*.52,tr*.5,tr*.38,1.5);ctx.fill();
      ctx.fillStyle='#34d399';ctx.fillRect(tcx+tr*.15,cy-tr*.44,1.6,tr*.22);
      // Dual swept-back whip antennas
      ctx.strokeStyle='#1d2421';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(tcx-tr*.9,cy-tr*.45);ctx.lineTo(tcx-tr*1.85,cy-tr*.95);
      ctx.moveTo(tcx-tr*.9,cy+tr*.45);ctx.lineTo(tcx-tr*1.85,cy+tr*.95);ctx.stroke();
    }

    function drawMediumTank(ctx,L,c){
      // MODERN MAIN BATTLE TANK (MBT): Sloped composite hull, Explosive Reactive Armor (ERA) bricks,
      // scalloped side skirts over 6-wheel tracks, twin turbine deck fans, wedge-cheek polygonal turret & smoothbore gun
      const cy=L/2,th=Math.round(L*.22),hx0=5,hx1=L-8,hw=hx1-hx0,hullTop=3+th-2,hullH=L-2*hullTop+2;
      [2,L-2-th].forEach((ty,idx)=>{
        drawTracks(ctx,2,L-9,ty,th,6,2.8,idx===0);
        // Serrated / ballistic armored side skirts with segment joints & ERA modules
        const sy=idx===0?ty+th-4.2:ty,sh=4.2;
        ctx.fillStyle=shade(c,-.32);ctx.fillRect(3,sy,L-13,sh);
        ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=.9;ctx.strokeRect(3,sy,L-13,sh);
        for(let sx=8;sx<L-12;sx+=6.5){
          ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sh);ctx.stroke();
          rivet(ctx,sx-3,sy+sh/2,.8);
        }
      });

      // Composite MBT Hull
      let hGrad=ctx.createLinearGradient(0,hullTop,0,hullTop+hullH);
      hGrad.addColorStop(0,shade(c,.34));hGrad.addColorStop(.35,shade(c,.1));hGrad.addColorStop(.5,hexStr(c));hGrad.addColorStop(.85,shade(c,-.36));hGrad.addColorStop(1,shade(c,-.56));
      ctx.fillStyle=hGrad;rrect(ctx,hx0,hullTop,hw,hullH,4);ctx.fill();

      // Disruptive NATO 3-tone style camouflage patches
      ctx.save();rrect(ctx,hx0,hullTop,hw,hullH,4);ctx.clip();
      for(let i=0;i<8;i++){
        ctx.fillStyle=i%2===0?shade(c,-.48):shade(c,.38);ctx.globalAlpha=.22;
        ctx.beginPath();ctx.ellipse(rnd(hx0+4,hx1-4),rnd(hullTop+3,hullTop+hullH-3),rnd(6,13),rnd(3,7),rnd(0,Math.PI),0,Math.PI*2);ctx.fill();
      }
      ctx.restore();

      // Sloped front glacis wedge & Explosive Reactive Armor (ERA) bricks array
      let glacis=ctx.createLinearGradient(hx1-hw*.28,0,hx1,0);
      glacis.addColorStop(0,'rgba(0,0,0,0)');glacis.addColorStop(.5,'rgba(255,255,255,.14)');glacis.addColorStop(1,'rgba(0,0,0,.38)');
      ctx.fillStyle=glacis;rrect(ctx,hx1-hw*.28,hullTop,hw*.28,hullH,4);ctx.fill();
      // ERA reactive armor tiles along front glacis
      const eraW=4.2,eraH=(hullH-4)/4;
      for(let r=0;r<4;r++){
        const ey=hullTop+2+r*eraH,ex=hx1-6.5;
        ctx.fillStyle=shade(c,-.18);ctx.fillRect(ex,ey+.4,eraW,eraH-.8);
        ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=.8;ctx.strokeRect(ex,ey+.4,eraW,eraH-.8);
        ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(ex+.5,ey+.8,eraW-1,.9);
      }

      // Rear engine deck with twin circular turbine cooling fans & louvers
      ctx.fillStyle='rgba(12,16,15,.68)';ctx.fillRect(hx0+2,hullTop+2,hw*.25,hullH-4);
      [cy-hullH*.22,cy+hullH*.22].forEach(fy=>{
        const fx=hx0+2+hw*.125,fr=Math.min(hullH*.18,4.2);
        ctx.fillStyle='#111514';ctx.beginPath();ctx.arc(fx,fy,fr,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#4a5450';ctx.lineWidth=.8;ctx.stroke();
        for(let a=0;a<6;a++){const ang=a*Math.PI/3;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+Math.cos(ang)*fr,fy+Math.sin(ang)*fr);ctx.stroke();}
      });

      // Hull border & weld highlights
      ctx.strokeStyle=shade(c,-.72);ctx.lineWidth=1.4;rrect(ctx,hx0,hullTop,hw,hullH,4);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(hx0+5,hullTop+1.4);ctx.lineTo(hx1-5,hullTop+1.4);ctx.stroke();

      // Angular wedge-cheek MBT composite turret (Leopard 2A6 / Abrams style)
      const tcx=L*.44,tr=L*.225,bh=Math.max(4.4,L*.105),bx1=L;
      ctx.save();ctx.translate(tcx,cy);
      const tPts=[
        [-tr*1.18,-tr*.74],[tr*.35,-tr*.92],[tr*1.16,-tr*.42],
        [tr*1.16,tr*.42],[tr*.35,tr*.92],[-tr*1.18,tr*.74],[-tr*1.32,0]
      ];
      // Turret shadow
      ctx.save();ctx.translate(2,2.2);ctx.fillStyle='rgba(0,0,0,.48)';poly(ctx,tPts);ctx.fill();ctx.restore();
      // Turret main composite armor fill
      let tGrad=ctx.createRadialGradient(-tr*.2,-tr*.3,tr*.1,0,0,tr*1.35);
      tGrad.addColorStop(0,shade(c,.45));tGrad.addColorStop(.5,shade(c,.06));tGrad.addColorStop(.86,shade(c,-.44));tGrad.addColorStop(1,shade(c,-.68));
      ctx.fillStyle=tGrad;poly(ctx,tPts);ctx.fill();
      // Sloped composite cheek facets
      ctx.fillStyle='rgba(255,255,255,.16)';poly(ctx,[[tr*.35,-tr*.92],[tr*1.16,-tr*.42],[tr*.55,-tr*.28],[tr*.15,-tr*.55]]);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.24)';poly(ctx,[[tr*.35,tr*.92],[tr*1.16,tr*.42],[tr*.55,tr*.28],[tr*.15,tr*.55]]);ctx.fill();
      ctx.strokeStyle=shade(c,-.78);ctx.lineWidth=1.4;poly(ctx,tPts);ctx.stroke();
      // Blow-out ammo panel seams on rear turret bustle
      ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=.9;ctx.strokeRect(-tr*1.08,-tr*.52,tr*.52,tr*1.04);
      ctx.beginPath();ctx.moveTo(-tr*1.08,0);ctx.lineTo(-tr*.56,0);ctx.stroke();
      // Inner turret roof bevel line
      ctx.strokeStyle='rgba(255,255,255,.24)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-tr*.95,-tr*.58);ctx.lineTo(tr*.3,-tr*.72);ctx.lineTo(tr*.85,-tr*.32);ctx.stroke();
      ctx.restore();

      // Armored gun mantlet & coaxial MG
      ctx.fillStyle=shade(c,-.5);rrect(ctx,tcx+tr*.92,cy-bh*1.08,6.5,bh*2.16,1.8);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=1;ctx.stroke();
      // Coaxial machine gun stub
      ctx.fillStyle='#222826';ctx.fillRect(tcx+tr*.92+5,cy+bh*.58,5.5,1.5);

      // 120mm Smoothbore cannon with thermal shroud rings, off-center bore evacuator & MRS tip
      let bGrad=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);
      bGrad.addColorStop(0,'#c2ccc6');bGrad.addColorStop(.35,'#758079');bGrad.addColorStop(.72,'#39413d');bGrad.addColorStop(1,'#141917');
      const bx0=tcx+tr*.92+5;
      ctx.fillStyle=bGrad;ctx.fillRect(bx0,cy-bh/2,bx1-bx0-5,bh);
      // Thermal sleeve clamp bands
      ctx.fillStyle='rgba(0,0,0,.55)';
      [bx0+4,bx0+14,bx1-8].forEach(rx=>ctx.fillRect(rx,cy-bh/2,1.1,bh));
      // Bore evacuator (fume extractor)
      ctx.fillStyle='#505954';rrect(ctx,tcx+tr*1.45,cy-bh*.78,bh*1.55,bh*1.56,1.5);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=1;ctx.stroke();
      // Muzzle brake & Muzzle Reference Sensor (MRS)
      ctx.fillStyle=bGrad;rrect(ctx,bx1-6.5,cy-bh/2-1.3,6.5,bh+2.6,1.4);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(bx1-4.5,cy-bh/2+.7,1.4,bh-1.4);ctx.fillRect(bx1-2.2,cy-bh/2+.7,1.4,bh-1.4);
      ctx.strokeStyle='#111513';ctx.lineWidth=1;ctx.stroke();

      // Commander's cupola, gunner's thermal sight housing & pintle HMG
      let cupG=ctx.createRadialGradient(tcx-tr*.22,cy-tr*.28,0,tcx-tr*.22,cy-tr*.28,tr*.38);
      cupG.addColorStop(0,'#adb8b2');cupG.addColorStop(1,'#2c3330');
      ctx.fillStyle=cupG;ctx.beginPath();ctx.arc(tcx-tr*.22,cy-tr*.25,tr*.34,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.78)';ctx.lineWidth=1;ctx.stroke();
      // Gunner's primary sight box with ruby-coated optics
      ctx.fillStyle='#2a322f';rrect(ctx,tcx+tr*.15,cy+tr*.18,tr*.42,tr*.34,1.2);ctx.fill();
      ctx.fillStyle='#fb7185';ctx.fillRect(tcx+tr*.44,cy+tr*.24,1.5,tr*.22);
      // Roof-mounted heavy MG pintle
      ctx.fillStyle='#1f2523';ctx.fillRect(tcx-tr*.1,cy-tr*.32,tr*.65,1.6);
      // Radio antenna
      ctx.strokeStyle='#222a27';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(tcx-tr*.85,cy+tr*.55);ctx.lineTo(tcx-tr*1.75,cy+tr*1.25);ctx.stroke();
    }

    function drawHeavyTank(ctx,L,c){
      // SUPER-HEAVY BREAKTHROUGH JUGGERNAUT: Massive wide double-track dreadnought hull, bolted heavy armor pontoons,
      // external rear fuel drums, octagonal cast-and-welded bunker turret, twin recoil cylinders, coaxial autocannon & huge siege cannon
      const cy=L/2,th=Math.round(L*.255),hx0=4,hx1=L-7,hw=hx1-hx0,hullTop=2+th-2.5,hullH=L-2*hullTop+3;
      [1.5,L-1.5-th].forEach((ty,idx)=>{
        drawTracks(ctx,1.5,L-7.5,ty,th,7,2.5,idx===0);
        // Heavy bolted armor pontoon side skirts covering inner half of tracks
        const sy=idx===0?ty+th*.42:ty,sh=th*.58;
        let sg=ctx.createLinearGradient(0,sy,0,sy+sh);
        sg.addColorStop(0,shade(c,.15));sg.addColorStop(1,shade(c,-.45));
        ctx.fillStyle=sg;rrect(ctx,3,sy,L-11.5,sh,2);ctx.fill();
        ctx.strokeStyle=shade(c,-.78);ctx.lineWidth=1.1;ctx.stroke();
        // Segment armor seams & heavy rivets
        for(let sx=9;sx<L-11;sx+=7.5){
          ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy+sh);ctx.stroke();
          rivet(ctx,sx-3.8,sy+sh*.35,1.05);
          rivet(ctx,sx-3.8,sy+sh*.7,1.05);
        }
      });

      // Massive stepped heavy hull
      const hPts=[
        [hx0,hullTop+2],[hx0+3,hullTop],[hx1-5,hullTop],[hx1,hullTop+3.5],
        [hx1,hullTop+hullH-3.5],[hx1-5,hullTop+hullH],[hx0+3,hullTop+hullH],[hx0,hullTop+hullH-2]
      ];
      let hGrad=ctx.createLinearGradient(0,hullTop,0,hullTop+hullH);
      hGrad.addColorStop(0,shade(c,.38));hGrad.addColorStop(.3,shade(c,.12));hGrad.addColorStop(.5,hexStr(c));hGrad.addColorStop(.82,shade(c,-.38));hGrad.addColorStop(1,shade(c,-.62));
      ctx.fillStyle=hGrad;poly(ctx,hPts);ctx.fill();

      // Heavy jagged splinter camouflage & bolted applique armor plates
      ctx.save();poly(ctx,hPts);ctx.clip();
      for(let i=0;i<10;i++){
        ctx.fillStyle=i%2===0?shade(c,-.52):shade(c,.36);ctx.globalAlpha=.24;
        ctx.beginPath();
        const px=rnd(hx0+3,hx1-3),py=rnd(hullTop+2,hullTop+hullH-2);
        ctx.moveTo(px,py);ctx.lineTo(px+rnd(6,14),py+rnd(-5,5));ctx.lineTo(px+rnd(3,10),py+rnd(5,11));ctx.closePath();ctx.fill();
      }
      ctx.globalAlpha=1;
      // Stepped heavy front glacis armor plate with weld seam
      let glacis=ctx.createLinearGradient(hx1-hw*.32,0,hx1,0);
      glacis.addColorStop(0,'rgba(255,255,255,.1)');glacis.addColorStop(.45,'rgba(255,255,255,.2)');glacis.addColorStop(1,'rgba(0,0,0,.45)');
      ctx.fillStyle=glacis;ctx.fillRect(hx1-hw*.3,hullTop,hw*.3,hullH);
      ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(hx1-hw*.3,hullTop);ctx.lineTo(hx1-hw*.3,hullTop+hullH);ctx.stroke();
      ctx.restore();

      // Spare track links mounted on front bow + heavy forged tow shackles
      for(let y=hullTop+3.5;y<hullTop+hullH-4.5;y+=2.6){
        ctx.fillStyle='#2a302d';ctx.fillRect(hx1-4.5,y,2.8,2);
        ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(hx1-4.5,y,1,2);
      }

      // Rear twin rectangular armored engine grilles & heavy exhaust stacks
      [cy-hullH*.24,cy+hullH*.06].forEach(gy=>{
        const gh=hullH*.18,gw=hw*.24;
        ctx.fillStyle='rgba(10,14,13,.78)';ctx.fillRect(hx0+3.5,gy,gw,gh);
        ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=.9;ctx.strokeRect(hx0+3.5,gy,gw,gh);
        for(let x=hx0+5;x<hx0+3+gw;x+=2.2){ctx.beginPath();ctx.moveTo(x,gy+1);ctx.lineTo(x,gy+gh-1);ctx.stroke();}
      });
      // External cylindrical auxiliary fuel drums mounted on rear hull
      [hullTop+2,cy+1].forEach(fy=>{
        const fh=hullH*.42;
        let fg=ctx.createLinearGradient(hx0-2,0,hx0+3.5,0);
        fg.addColorStop(0,'#272d2a');fg.addColorStop(.45,'#68736e');fg.addColorStop(1,'#181c1a');
        ctx.fillStyle=fg;rrect(ctx,hx0-2,fy,5,fh,1.5);ctx.fill();
        ctx.strokeStyle='#0d100f';ctx.lineWidth=.9;ctx.stroke();
        ctx.fillStyle='#1b201e';ctx.fillRect(hx0-2,fy+fh*.3,5,1);ctx.fillRect(hx0-2,fy+fh*.7,5,1);
      });

      ctx.strokeStyle=shade(c,-.78);ctx.lineWidth=1.6;poly(ctx,hPts);ctx.stroke();
      [[hx0+hw*.36,hullTop+3],[hx0+hw*.36,hullTop+hullH-3],[hx1-7,hullTop+3],[hx1-7,hullTop+hullH-3]].forEach(([x,y])=>rivet(ctx,x,y,1.3));

      // Massive Octagonal Bunker Turret with spaced side armor
      const tcx=L*.43,tr=L*.25,bh=Math.max(6,L*.135),bx1=L;
      ctx.save();ctx.translate(tcx,cy);
      const tPts=[
        [-tr*1.12,-tr*.62],[-tr*.45,-tr*.94],[tr*.52,-tr*.94],[tr*1.08,-tr*.54],
        [tr*1.08,tr*.54],[tr*.52,tr*.94],[-tr*.45,tr*.94],[-tr*1.12,tr*.62]
      ];
      // Deep turret shadow
      ctx.save();ctx.translate(2.4,2.6);ctx.fillStyle='rgba(0,0,0,.52)';poly(ctx,tPts);ctx.fill();ctx.restore();
      // Spaced side armor plates on turret flanks
      ctx.fillStyle=shade(c,-.42);
      ctx.fillRect(-tr*.85,-tr*1.05,tr*1.25,2.2);ctx.fillRect(-tr*.85,tr*1.05-2.2,tr*1.25,2.2);
      ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=.9;
      ctx.strokeRect(-tr*.85,-tr*1.05,tr*1.25,2.2);ctx.strokeRect(-tr*.85,tr*1.05-2.2,tr*1.25,2.2);

      // Turret main armor block
      let tGrad=ctx.createRadialGradient(-tr*.25,-tr*.32,tr*.12,0,0,tr*1.35);
      tGrad.addColorStop(0,shade(c,.46));tGrad.addColorStop(.48,shade(c,.08));tGrad.addColorStop(.85,shade(c,-.46));tGrad.addColorStop(1,shade(c,-.72));
      ctx.fillStyle=tGrad;poly(ctx,tPts);ctx.fill();
      ctx.strokeStyle=shade(c,-.82);ctx.lineWidth=1.6;ctx.stroke();

      // Welded octagonal roof plate & lifting lugs
      ctx.strokeStyle='rgba(255,255,255,.26)';ctx.lineWidth=1.1;
      poly(ctx,tPts.map(([x,y])=>[x*.72,y*.72]));ctx.stroke();
      [[-tr*.7,-tr*.6],[tr*.4,-tr*.68],[-tr*.7,tr*.6],[tr*.4,tr*.68]].forEach(([x,y])=>rivet(ctx,x,y,1.15));
      ctx.restore();

      // Heavy cast gun mantlet with twin hydraulic recoil cylinders on top
      const mx0=tcx+tr*.86;
      ctx.fillStyle=shade(c,-.48);rrect(ctx,mx0,cy-bh*1.15,8,bh*2.3,2.2);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.82)';ctx.lineWidth=1.1;ctx.stroke();
      // Twin armored recoil recuperator cylinders
      [-bh*.62,bh*.32].forEach(ry=>{
        let rg=ctx.createLinearGradient(0,cy+ry,0,cy+ry+bh*.3);
        rg.addColorStop(0,'#b8c2bc');rg.addColorStop(1,'#343c38');
        ctx.fillStyle=rg;rrect(ctx,mx0+2,cy+ry,9,bh*.3,1);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=.7;ctx.stroke();
      });
      // Secondary coaxial heavy autocannon barrel alongside main siege gun
      ctx.fillStyle='#2b3330';ctx.fillRect(mx0+7,cy+bh*.56,8,2.2);
      ctx.fillStyle='#111514';ctx.fillRect(mx0+13.5,cy+bh*.52,2,3);

      // Massive siege cannon barrel with reinforcement collar & giant double-baffle box muzzle brake
      let bGrad=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);
      bGrad.addColorStop(0,'#cbd4ce');bGrad.addColorStop(.32,'#7a857e');bGrad.addColorStop(.68,'#3a423e');bGrad.addColorStop(1,'#121614');
      const bx0=mx0+7.5;
      ctx.fillStyle=bGrad;ctx.fillRect(bx0,cy-bh/2,bx1-bx0-7.5,bh);
      ctx.strokeStyle='rgba(0,0,0,.75)';ctx.lineWidth=.9;ctx.strokeRect(bx0,cy-bh/2,bx1-bx0-7.5,bh);
      // Heavy barrel reinforcement sleeve & bore evacuator
      ctx.fillStyle='#48514d';rrect(ctx,bx0+4,cy-bh*.76,bh*1.5,bh*1.52,1.5);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=1;ctx.stroke();
      rivet(ctx,bx0+4+bh*.75,cy,1.1);
      // Giant multi-baffle siege muzzle brake
      ctx.fillStyle=bGrad;rrect(ctx,bx1-8.5,cy-bh/2-2.2,8.5,bh+4.4,1.8);ctx.fill();
      ctx.strokeStyle='#0d1110';ctx.lineWidth=1.1;ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.88)';
      ctx.fillRect(bx1-6.5,cy-bh/2+.6,1.8,bh-1.2);
      ctx.fillRect(bx1-3.4,cy-bh/2+.6,1.8,bh-1.2);

      // Twin armored cupolas (commander & loader hatches) + heavy AA gun mount
      [[tcx-tr*.32,cy-tr*.32,tr*.34],[tcx-tr*.32,cy+tr*.32,tr*.28]].forEach(([cx,cy2,cr])=>{
        let cupG=ctx.createRadialGradient(cx-1,cy2-1,0,cx,cy2,cr*1.1);
        cupG.addColorStop(0,'#b0bab4');cupG.addColorStop(1,'#262d2a');
        ctx.fillStyle=cupG;ctx.beginPath();ctx.arc(cx,cy2,cr,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.8)';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(cx-cr*.4,cy2-.7,cr*.8,1.4);
      });
      // Heavy pintle machine gun & ammo box on roof
      ctx.fillStyle='#e2dea4';ctx.fillRect(tcx+tr*.08,cy-tr*.45,2.6,2.6);
      ctx.fillStyle='#1f2623';ctx.fillRect(tcx+tr*.15,cy-tr*.38,tr*.7,2);
    }

    function drawTankTexture(ctx,L,c,type='medium'){
      if(type==='light')return drawLightTank(ctx,L,c);
      if(type==='heavy')return drawHeavyTank(ctx,L,c);
      return drawMediumTank(ctx,L,c);
    }

    function buildSharedTextures(scene){
      if(scene.textures.exists('puff'))return;
      Object.entries(CHASSIS_STATS).forEach(([type,s])=>[1,2,3].forEach(player=>{
        const size=s.size+18,c=player===1?s.color:(player===2?0x4c91d0:0xc9574e);
        makeTex(scene,`tank_${type}_p${player}`,size,size,(ctx)=>drawTankTexture(ctx,size,c,type));
      }));
      // High-detail glowing armor-piercing sabot/tracer shell
      makeTex(scene,'shell',14,14,ctx=>{
        const g=ctx.createRadialGradient(7,7,0,7,7,7);
        g.addColorStop(0,'#ffffff');g.addColorStop(0.28,'#fff4b8');g.addColorStop(0.62,'rgba(255,145,25,.85)');g.addColorStop(1,'rgba(255,70,0,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,14,14);
        // elongated incandescent projectile core
        ctx.fillStyle='#fffbeb';ctx.beginPath();ctx.ellipse(7.5,7,3.4,2.1,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(8.2,7,1.4,0,Math.PI*2);ctx.fill();
      });
      // Detailed ATGM / guided rocket projectile with tandem warhead, fins & shock-diamond exhaust
      makeTex(scene,'missile',36,14,ctx=>{
        blob(ctx,4,7,10,'255,120,25',.95);blob(ctx,2.5,7,5.5,'255,245,190',1);
        // Cruciform tail fins & mid-body control canards
        ctx.fillStyle='#181e1c';
        poly(ctx,[[6,7],[1,0.8],[11,3.2],[11,10.8],[1,13.2]]);ctx.fill();
        poly(ctx,[[19,3],[21,1.2],[24,3],[24,11],[21,12.8],[19,11]]);ctx.fill();
        // Metallic cylindrical missile body
        let g=ctx.createLinearGradient(0,3,0,11);
        g.addColorStop(0,'#f1f5f3');g.addColorStop(0.35,'#9aa5a0');g.addColorStop(0.75,'#454e4a');g.addColorStop(1,'#1f2523');
        ctx.fillStyle=g;rrect(ctx,5,3,21,8,3.2);ctx.fill();
        // Tactical markings & panel rings
        ctx.fillStyle='#eab308';ctx.fillRect(13,3,2.5,8);
        ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(9.5,3,1,8);ctx.fillRect(20,3,1,8);
        // Shaped-charge warhead nose cone with copper/crimson tip
        let tipG=ctx.createLinearGradient(0,3,0,11);
        tipG.addColorStop(0,'#ff7a59');tipG.addColorStop(0.5,'#dc2626');tipG.addColorStop(1,'#691006');
        ctx.fillStyle=tipG;ctx.beginPath();ctx.moveTo(25.5,3);ctx.quadraticCurveTo(33,4.8,35.5,7);ctx.quadraticCurveTo(33,9.2,25.5,11);ctx.closePath();ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=.9;ctx.stroke();
      });
      // High-detail Composite Armor Powerup Crate & Shield Emblem
      makeTex(scene,'armor_drop',36,36,ctx=>{
        blob(ctx,18,18,18,'255,210,50',.42);
        // Military reinforced crate base behind shield
        ctx.fillStyle='#2a332e';rrect(ctx,5,5,26,26,4);ctx.fill();
        ctx.strokeStyle='#68756e';ctx.lineWidth=1.2;ctx.stroke();
        // Heavy composite heraldic shield
        ctx.beginPath();ctx.moveTo(18,2.5);ctx.lineTo(31,7.5);ctx.lineTo(29,21);ctx.quadraticCurveTo(27,29.5,18,34);ctx.quadraticCurveTo(9,29.5,7,21);ctx.lineTo(5,7.5);ctx.closePath();
        let g=ctx.createLinearGradient(5,2,31,34);
        g.addColorStop(0,'#fff099');g.addColorStop(0.45,'#f59e0b');g.addColorStop(0.85,'#b45309');g.addColorStop(1,'#632c04');
        ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fef3c7';ctx.lineWidth=1.6;ctx.stroke();
        // Inner recessed armor plate
        ctx.save();ctx.clip();
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(18,2.5);ctx.lineTo(5,7.5);ctx.lineTo(7,21);ctx.lineTo(18,17);ctx.closePath();ctx.fill();
        ctx.restore();
        // Repair/Armor cross emblem with 3D bevel
        ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(16.5,9.5,4,18);ctx.fillRect(10.5,15.5,16,6);
        ctx.fillStyle='#fffbeb';ctx.fillRect(16,8.5,4,18);ctx.fillRect(10,14.5,16,6);
        [[9,9],[27,9],[11,23],[25,23]].forEach(([x,y])=>rivet(ctx,x,y,1));
      });
      // Rocket Launcher / MLRS Airstrike Weapon Drop Crate
      makeTex(scene,'rocket_launcher_drop',36,36,ctx=>{
        blob(ctx,18,18,18,'255,105,35',.38);
        // Outer radar/target reticle ring
        ctx.strokeStyle='rgba(255,205,150,.85)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(18,18,15.5,0,Math.PI*2);ctx.stroke();
        [0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(a=>{ctx.beginPath();ctx.moveTo(18+Math.cos(a)*13,18+Math.sin(a)*13);ctx.lineTo(18+Math.cos(a)*17,18+Math.sin(a)*17);ctx.stroke();});
        ctx.save();ctx.translate(18,18);ctx.rotate(-.55);
        // Rocket pod launcher tube assembly
        let g=ctx.createLinearGradient(0,-6.5,0,6.5);
        g.addColorStop(0,'#e2e8e4');g.addColorStop(0.45,'#5c6661');g.addColorStop(1,'#1e2422');
        ctx.fillStyle=g;rrect(ctx,-13,-5.5,24,11,3);ctx.fill();ctx.strokeStyle='#0f1312';ctx.lineWidth=1.4;ctx.stroke();
        // Exhaust venturi at back
        ctx.fillStyle='#181e1c';rrect(ctx,-20,-4,6,8,1.5);ctx.fill();
        blob(ctx,-20,0,5,'255,150,40',.75);
        // Emerging warhead nosecone + hazard band
        ctx.fillStyle='#ea580c';ctx.beginPath();ctx.moveTo(11,-5);ctx.lineTo(17.5,-2.5);ctx.lineTo(17.5,2.5);ctx.lineTo(11,5);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#facc15';ctx.fillRect(-5,-4.5,2.8,9);ctx.fillRect(3,-4.5,1.8,9);
        ctx.restore();
      });
      // Volumetric soft smoke/fire particle puff
      makeTex(scene,'puff',64,64,ctx=>{
        const g=ctx.createRadialGradient(32,32,0,32,32,32);
        g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.28,'rgba(255,242,205,.82)');g.addColorStop(0.65,'rgba(255,165,65,.34)');g.addColorStop(1,'rgba(255,100,20,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
        for(let i=0;i<6;i++){const a=i*Math.PI/3;blob(ctx,32+Math.cos(a)*8,32+Math.sin(a)*8,16,'255,245,220',.18);}
      });
      // Realistic blast crater & scorch decal
      makeTex(scene,'scorch',96,96,ctx=>{
        blob(ctx,48,48,46,'12,10,8',.82);
        // raised crater rim & deep charred center pit
        ctx.strokeStyle='rgba(60,52,44,.32)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(48,48,18,0,Math.PI*2);ctx.stroke();
        blob(ctx,48,48,20,'4,3,2',.9);
        // radiating soot streaks & ejecta
        for(let i=0;i<18;i++){
          const a=i/18*Math.PI*2+rnd(-.12,.12),r1=rnd(12,22),r2=rnd(30,45);
          ctx.strokeStyle=`rgba(10,8,6,${rnd(.25,.55)})`;ctx.lineWidth=rnd(1.2,2.8);
          ctx.beginPath();ctx.moveTo(48+Math.cos(a)*r1,48+Math.sin(a)*r1);ctx.lineTo(48+Math.cos(a)*r2,48+Math.sin(a)*r2);ctx.stroke();
        }
        for(let i=0;i<16;i++)blob(ctx,rnd(16,80),rnd(16,80),rnd(5,14),'6,5,4',.32);
      });
      // Realistic metallic tread grouser imprint
      makeTex(scene,'trackmark',10,6,ctx=>{
        ctx.fillStyle='rgba(0,0,0,.58)';
        rrect(ctx,0,0,4,6,1.2);ctx.fill();rrect(ctx,5.5,0,4,6,1.2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(1,1,1,4);ctx.fillRect(6.5,1,1,4);
      });
    }

      create(){gameAudio.startMusic('menu');const w=this.w=this.scale.width,h=this.h=this.scale.height;this.scale.on('resize',this.handleResize,this);this.events.once(Phaser.Scenes.Events.SHUTDOWN,()=>this.scale.off('resize',this.handleResize,this));this.cameras.main.setBackgroundColor('#101820');buildSharedTextures(this);drawBackdrop(this,w,h);
        const title=this.solo?'RUN OVER':`PLAYER ${this.winner} WINS!`;
        this.add.text(w/2,h*.3,title,{font:`${Math.min(28,w/35)}px ${FONT}`,color:'#facc15',stroke:'#713f12',strokeThickness:6}).setOrigin(.5).setShadow(0,5,'#000000',8,true,true);
        const detail=this.solo?`HIGHEST ROUND REACHED: ${this.highestRound}`:`FINAL SCORE   ${matchState.p1Score} — ${matchState.p2Score}`;
        this.add.text(w/2,h*.4,detail,{font:`${Math.max(9,w/90)}px ${FONT}`,color:'#d4dde0'}).setOrigin(.5);
        drawButton(this,w/2,h*.58,Math.min(340,w*.55),52,this.solo?'TRY AGAIN':'REMATCH',0x276b42,()=>{matchState.p1Score=0;matchState.p2Score=0;matchState.round=1;matchState.highestRound=1;this.scene.start('GameScene');},11);
        drawButton(this,w/2,h*.7,Math.min(340,w*.55),52,'MAIN MENU',0x344b58,()=>this.scene.start('MenuScene'),11);
      }
      handleResize(size){if(size.width!==this.w||size.height!==this.h)this.scene.restart({winner:this.winner,solo:this.solo,highestRound:this.highestRound});}
    }

    const game=new Phaser.Game({
      type:Phaser.AUTO,parent:'game-container',backgroundColor:'#101820',
      scale:{mode:Phaser.Scale.RESIZE,width:window.innerWidth,height:window.innerHeight},
      physics:{default:'arcade',arcade:{gravity:{x:0,y:0},debug:false}},
      render:{antialias:true,pixelArt:false,roundPixels:false},scene:[MenuScene,GameScene,GameOverScene]
    });
    document.getElementById('fullscreen').addEventListener('click',async()=>{
      try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){}
    });
    document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'EXIT FULL':'FULLSCREEN';});
  </script>
</body>
</html>
