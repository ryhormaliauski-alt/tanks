<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Pixel Tank Battle</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#101820; }
    body { font-family:'Press Start 2P',monospace; user-select:none; }
    #game-container { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; background:#101820; }
    #game-container canvas { display:block; width:100%; height:100%; }
    #fullscreen { position:fixed; right:14px; bottom:14px; z-index:10; border:1px solid #82909a; border-radius:4px; padding:9px 11px; color:#e2e8f0; background:rgba(10,16,22,.78); font:10px 'Press Start 2P',monospace; cursor:pointer; }
    #fullscreen:hover { background:#334155; }
    #sound-toggle { position:fixed; right:14px; bottom:60px; z-index:10; border:1px solid #82909a; border-radius:4px; padding:9px 11px; color:#e2e8f0; background:rgba(10,16,22,.78); font:10px 'Press Start 2P',monospace; cursor:pointer; }
    #sound-toggle:hover { background:#334155; }
  </style>
</head>
<body>
  <main id="game-container" aria-label="Pixel Tank Battle game"></main>
  <button id="fullscreen" type="button" aria-label="Toggle fullscreen">FULLSCREEN</button>
  <button id="sound-toggle" type="button" aria-label="Turn sound off">SOUND ON</button>
  <script>
    const matchState = { mode:'local', p1Chassis:'medium', p2Chassis:'medium', p1Score:0, p2Score:0, round:1, highestRound:1, currentTheme:'city' };
    const THEMES = {
      city:    { name:'CITY', bg:0x252c30, floor:0x30383a, accent:0x697275, wall:0xa64f3e, light:0xd37a55, dark:0x63392f },
      factory: { name:'FACTORY', bg:0x202a30, floor:0x28353a, accent:0x52656a, wall:0x66777a, light:0xa8b2aa, dark:0x39464a },
      winter:  { name:'WINTER FOREST', bg:0x8299a0, floor:0xb9c8c8, accent:0xe3eeee, wall:0x557d83, light:0x91b5b3, dark:0x315259 },
      desert:  { name:'DESERT', bg:0x9a7047, floor:0xb9905d, accent:0xd1ad75, wall:0x9e6841, light:0xd0a269, dark:0x65452f }
    };
    const CHASSIS_STATS = {
      light:{name:'LIGHT TANK',hp:60,speed:210,turnRate:190,color:0x58b86b,size:29},
      medium:{name:'MEDIUM TANK',hp:100,speed:150,turnRate:140,color:0x428bd0,size:35},
      heavy:{name:'HEAVY TANK',hp:160,speed:95,turnRate:90,color:0xc9574e,size:41}
    };
    const FONT = '"Press Start 2P"';
    // ---------- Visual helpers (canvas-drawn textures, gradients, soft lighting) ----------
    const hexStr=n=>'#'+n.toString(16).padStart(6,'0');
    function shade(n,f){const t=f<0?0:255,k=Math.abs(f),r=n>>16&255,g=n>>8&255,b=n&255;return hexStr((Math.round((t-r)*k+r)<<16)|(Math.round((t-g)*k+g)<<8)|Math.round((t-b)*k+b));}
    function rrect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function makeTex(scene,key,w,h,fn){if(scene.textures.exists(key))scene.textures.remove(key);const t=scene.textures.createCanvas(key,Math.max(1,Math.ceil(w)),Math.max(1,Math.ceil(h)));fn(t.getContext(),t.width,t.height);t.refresh();return t;}
    function blob(ctx,x,y,r,color,alpha){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${color},${alpha})`);g.addColorStop(1,`rgba(${color},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
    const rnd=(a,b)=>a+Math.random()*(b-a);

    function drawTankTexture(ctx,L,c){
      const th=Math.round(L*.2),cy=L/2,hullTop=4+th-3,hullH=L-2*hullTop;
      // tracks with links and road wheels
      [4,L-4-th].forEach(ty=>{
        const x0=3,x1=L-13,len=x1-x0;
        let g=ctx.createLinearGradient(0,ty,0,ty+th);g.addColorStop(0,'#454b47');g.addColorStop(.5,'#1e2321');g.addColorStop(1,'#0c0f0e');
        ctx.fillStyle=g;rrect(ctx,x0,ty,len,th,th*.42);ctx.fill();
        for(let x=x0+4;x<x1-3;x+=3.5){ctx.fillStyle='rgba(150,158,150,.28)';ctx.fillRect(x,ty+1.5,1.2,th-3);}
        for(let i=0;i<5;i++){const wx=x0+th*.55+i*(len-th*1.1)/4,wy=ty+th/2,r=th*.34;g=ctx.createRadialGradient(wx-1,wy-1,0,wx,wy,r);g.addColorStop(0,'#8a928b');g.addColorStop(1,'#2a302d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(wx,wy,r,0,7);ctx.fill();}
        ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=1;rrect(ctx,x0,ty,len,th,th*.42);ctx.stroke();
        // fender
        ctx.fillStyle=shade(c,-.45);ctx.globalAlpha=.9;ctx.fillRect(x0+2,ty<cy?ty+th-3:ty,len-4,3);ctx.globalAlpha=1;
      });
      // hull
      const hx0=6,hx1=L-10,hw=hx1-hx0;
      let g=ctx.createLinearGradient(0,hullTop,0,hullTop+hullH);g.addColorStop(0,shade(c,.3));g.addColorStop(.45,hexStr(c));g.addColorStop(1,shade(c,-.42));
      ctx.fillStyle=g;rrect(ctx,hx0,hullTop,hw,hullH,5);ctx.fill();
      // sloped front glacis
      g=ctx.createLinearGradient(hx1-hw*.22,0,hx1,0);g.addColorStop(0,'rgba(255,255,255,.0)');g.addColorStop(1,'rgba(255,255,255,.2)');ctx.fillStyle=g;rrect(ctx,hx1-hw*.22,hullTop,hw*.22,hullH,5);ctx.fill();
      // camo mottling
      ctx.save();rrect(ctx,hx0,hullTop,hw,hullH,5);ctx.clip();
      for(let i=0;i<7;i++){ctx.fillStyle=`rgba(0,0,0,${rnd(.06,.14)})`;ctx.beginPath();ctx.ellipse(rnd(hx0,hx1),rnd(hullTop,hullTop+hullH),rnd(3,8),rnd(2,5),rnd(0,3),0,7);ctx.fill();}
      // rear engine deck with grille
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(hx0,hullTop,hw*.24,hullH);
      ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;for(let y=hullTop+3;y<hullTop+hullH-2;y+=2.6){ctx.beginPath();ctx.moveTo(hx0+2,y);ctx.lineTo(hx0+hw*.22,y);ctx.stroke();}
      ctx.restore();
      ctx.strokeStyle=shade(c,-.62);ctx.lineWidth=1.4;rrect(ctx,hx0,hullTop,hw,hullH,5);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(hx0+6,hullTop+1.5);ctx.lineTo(hx1-6,hullTop+1.5);ctx.stroke();
      // rivets
      ctx.fillStyle='rgba(0,0,0,.45)';[[hx0+hw*.3,hullTop+3],[hx0+hw*.3,hullTop+hullH-3],[hx1-4,hullTop+3],[hx1-4,hullTop+hullH-3]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,1.1,0,7);ctx.fill();});
      // barrel
      const tcx=L*.46,tr=L*.2,bh=Math.max(4,L*.1),bx1=L-1;
      g=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2);g.addColorStop(0,'#aab3ab');g.addColorStop(.4,'#69726b');g.addColorStop(1,'#222927');
      ctx.fillStyle=g;ctx.fillRect(tcx,cy-bh/2,bx1-tcx,bh);
      g=ctx.createLinearGradient(0,cy-bh/2-1,0,cy+bh/2+1);g.addColorStop(0,'#59615b');g.addColorStop(1,'#151a18');ctx.fillStyle=g;rrect(ctx,bx1-7,cy-bh/2-1.2,7,bh+2.4,1.5);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(bx1-.8,cy-bh/2+1,.8,bh-2);
      ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(bx1-10,cy-bh/2,1,bh);
      // turret
      ctx.save();ctx.translate(tcx,cy);ctx.scale(1.18,1);
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(1,1.5,tr+1,0,7);ctx.fill();
      g=ctx.createRadialGradient(-tr*.35,-tr*.4,tr*.1,0,0,tr*1.15);g.addColorStop(0,shade(c,.5));g.addColorStop(.5,shade(c,.05));g.addColorStop(1,shade(c,-.5));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,tr,0,7);ctx.fill();
      ctx.strokeStyle=shade(c,-.65);ctx.lineWidth=1.3;ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,tr*.72,Math.PI*1.05,Math.PI*1.75);ctx.stroke();
      ctx.restore();
      // mantlet, hatch, cupola, antenna
      ctx.fillStyle=shade(c,-.55);rrect(ctx,tcx+tr*.95,cy-bh*.9,4,bh*1.8,1.5);ctx.fill();
      g=ctx.createRadialGradient(tcx-tr*.35,cy-tr*.2,0,tcx-tr*.3,cy,tr*.42);g.addColorStop(0,'#9aa39b');g.addColorStop(1,'#2c3330');ctx.fillStyle=g;ctx.beginPath();ctx.arc(tcx-tr*.3,cy,tr*.38,0,7);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(tcx-tr*.4,cy-.7,tr*.2,1.4);
      ctx.fillStyle='#d9d5a2';ctx.fillRect(tcx+tr*.25,cy-bh/2-2.4,2,2);
      ctx.strokeStyle='#1a1f1d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tcx-tr*.7,cy+tr*.55);ctx.lineTo(tcx-tr*1.5,cy+tr*1.1);ctx.stroke();
    }

    function buildSharedTextures(scene){
      if(scene.textures.exists('puff'))return;
      Object.entries(CHASSIS_STATS).forEach(([type,s])=>[1,2,3].forEach(player=>{
        const size=s.size+18,c=player===1?s.color:(player===2?0x4c91d0:0xc9574e);
        makeTex(scene,`tank_${type}_p${player}`,size,size,(ctx)=>drawTankTexture(ctx,size,c));
      }));
      makeTex(scene,'shell',10,10,ctx=>{const g=ctx.createRadialGradient(5,5,0,5,5,5);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#ffe680');g.addColorStop(.7,'rgba(255,160,40,.55)');g.addColorStop(1,'rgba(255,120,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,10,10);});
      makeTex(scene,'missile',32,12,ctx=>{
        blob(ctx,3,6,9,'255,140,40',.9);blob(ctx,2,6,5,'255,230,160',1);
        ctx.fillStyle='#2c3130';ctx.beginPath();ctx.moveTo(5,6);ctx.lineTo(1,0.5);ctx.lineTo(9,3);ctx.lineTo(9,9);ctx.lineTo(1,11.5);ctx.closePath();ctx.fill();
        let g=ctx.createLinearGradient(0,2,0,10);g.addColorStop(0,'#f1f4f1');g.addColorStop(.45,'#a9b0aa');g.addColorStop(1,'#4a514c');ctx.fillStyle=g;rrect(ctx,5,2.5,19,7,3);ctx.fill();
        ctx.fillStyle='#d6a526';ctx.fillRect(12,2.5,2,7);
        g=ctx.createLinearGradient(0,2,0,10);g.addColorStop(0,'#ff7b5c');g.addColorStop(1,'#8a1c10');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(23,2.5);ctx.quadraticCurveTo(30,4.5,31.5,6);ctx.quadraticCurveTo(30,7.5,23,9.5);ctx.closePath();ctx.fill();
      });
      makeTex(scene,'armor_drop',32,32,ctx=>{
        blob(ctx,16,16,16,'255,210,70',.35);
        ctx.beginPath();ctx.moveTo(16,2);ctx.lineTo(28,6);ctx.lineTo(26,19);ctx.quadraticCurveTo(24,26,16,30);ctx.quadraticCurveTo(8,26,6,19);ctx.lineTo(4,6);ctx.closePath();
        let g=ctx.createLinearGradient(0,2,0,30);g.addColorStop(0,'#ffe27a');g.addColorStop(.5,'#e0a712');g.addColorStop(1,'#8b5c06');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff3b0';ctx.lineWidth=1.6;ctx.stroke();
        ctx.fillStyle='#fffbe0';ctx.fillRect(14,8,4,15);ctx.fillRect(10,13,12,4);
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(16,4);ctx.lineTo(8,7);ctx.lineTo(9,12);ctx.lineTo(16,9);ctx.fill();
      });
      makeTex(scene,'rocket_launcher_drop',32,32,ctx=>{
        blob(ctx,16,16,16,'255,125,55',.3);
        ctx.save();ctx.translate(16,16);ctx.rotate(-.55);
        let g=ctx.createLinearGradient(0,-5,0,5);g.addColorStop(0,'#d7ded6');g.addColorStop(.45,'#737d78');g.addColorStop(1,'#303a3a');
        ctx.fillStyle=g;rrect(ctx,-11,-4.5,21,9,3);ctx.fill();ctx.strokeStyle='#202827';ctx.lineWidth=1.4;ctx.stroke();
        ctx.fillStyle='#272e2d';rrect(ctx,-19,-3,5,6,1.5);ctx.fill();
        ctx.fillStyle='#d75c32';ctx.beginPath();ctx.moveTo(10,-5);ctx.lineTo(15,-3);ctx.lineTo(15,3);ctx.lineTo(10,5);ctx.closePath();ctx.fill();ctx.stroke();
        ctx.fillStyle='#eab308';ctx.fillRect(-4,-3.3,2,6.6);
        ctx.fillStyle='#29312f';ctx.beginPath();ctx.moveTo(-2,3);ctx.lineTo(3,3);ctx.lineTo(5,9);ctx.lineTo(1,8);ctx.lineTo(-2,10);ctx.closePath();ctx.fill();
        ctx.fillStyle='#c2cbc3';rrect(ctx,-2,-7,7,2.4,1);ctx.fill();
        ctx.restore();
        ctx.strokeStyle='rgba(255,230,190,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(16,16,14,0,Math.PI*2);ctx.stroke();
      });
      makeTex(scene,'puff',64,64,ctx=>{const g=ctx.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,64,64);});
      makeTex(scene,'scorch',96,96,ctx=>{blob(ctx,48,48,48,'8,6,4',.7);for(let i=0;i<14;i++)blob(ctx,rnd(18,78),rnd(18,78),rnd(6,14),'6,5,4',.25);});
      makeTex(scene,'trackmark',7,4,ctx=>{ctx.fillStyle='rgba(0,0,0,.5)';rrect(ctx,0,0,7,4,1.5);ctx.fill();});
    }
    function drawBackdrop(scene,w,h){
      makeTex(scene,'backdrop',w,h,(ctx)=>{
        let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1b2832');g.addColorStop(1,'#090d10');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
        ctx.strokeStyle='rgba(120,160,180,.05)';ctx.lineWidth=1;for(let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
        blob(ctx,w/2,h*.35,Math.max(w,h)*.55,'70,110,130',.22);
        g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.65)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
      });
      scene.add.image(w/2,h/2,'backdrop').setDepth(-10);
    }
    function drawPanel(scene,x,y,w,h,stroke){
      const g=scene.add.graphics();
      g.fillStyle(0x000000,.4);g.fillRoundedRect(x-w/2+3,y-h/2+6,w,h,12);
      g.fillStyle(0x16222a,.96);g.fillRoundedRect(x-w/2,y-h/2,w,h,12);
      g.fillStyle(0xffffff,.05);g.fillRoundedRect(x-w/2+2,y-h/2+2,w-4,h*.45,{tl:10,tr:10,bl:0,br:0});
      g.lineStyle(2,stroke,1);g.strokeRoundedRect(x-w/2,y-h/2,w,h,12);return g;
    }
    function drawButton(scene,x,y,w,h,label,color,callback,fontSize=11) {
      const g=scene.add.graphics();
      const paint=hover=>{g.clear();
        g.fillStyle(0x000000,.4);g.fillRoundedRect(x-w/2+2,y-h/2+5,w,h,9);
        g.fillStyle(hover?Phaser.Display.Color.ValueToColor(color).lighten(14).color:color);g.fillRoundedRect(x-w/2,y-h/2,w,h,9);
        g.fillStyle(0xffffff,hover?.2:.13);g.fillRoundedRect(x-w/2+2,y-h/2+2,w-4,h/2-2,{tl:7,tr:7,bl:0,br:0});
        g.fillStyle(0x000000,.18);g.fillRoundedRect(x-w/2+2,y+h/2-8,w-4,6,{tl:0,tr:0,bl:7,br:7});
        g.lineStyle(2,hover?0xfacc15:0xb8c4c8,.9);g.strokeRoundedRect(x-w/2,y-h/2,w,h,9);};
      paint(false);
      const box=scene.add.zone(x,y,w,h).setInteractive({useHandCursor:true});
      box.on('pointerover',()=>paint(true));box.on('pointerout',()=>paint(false));box.on('pointerdown',callback);
      scene.add.text(x,y,label,{font:`${fontSize}px ${FONT}`,color:'#f8fafc',align:'center'}).setOrigin(.5).setDepth(1).setShadow(0,2,'#000000',3,false,true);
      return box;
    }

    class GameAudio {
      constructor(){this.enabled=true;this.context=null;this.master=null;this.musicRequested=false;this.musicStep=0;this.musicTimer=null;this.noiseBuffer=null;this.engines=new Map();}
      unlock(){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;
        if(!this.context){this.context=new AudioContextClass();this.master=this.context.createGain();this.master.gain.value=this.enabled?.32:0;this.master.connect(this.context.destination);}
        if(this.context.state==='suspended')this.context.resume();
        if(this.musicRequested)this.startMusic();
      }
      setEnabled(enabled){this.enabled=enabled;this.updateButton();if(!this.context)return;if(enabled){this.context.resume();this.master.gain.setTargetAtTime(.32,this.context.currentTime,.06);if(this.musicRequested)this.startMusic();}else this.master.gain.setTargetAtTime(0,this.context.currentTime,.06);}
      updateButton(){const button=document.getElementById('sound-toggle');if(button){button.textContent=this.enabled?'SOUND ON':'SOUND OFF';button.setAttribute('aria-label',this.enabled?'Turn sound off':'Turn sound on');}}
      startMusic(){this.musicRequested=true;if(!this.context||!this.enabled||this.musicTimer!==null)return;this.musicTimer=window.setTimeout(()=>this.playMusicStep(),0);}
      playMusicStep(){
        this.musicTimer=null;if(!this.context||!this.enabled||!this.musicRequested)return;
        const melody=[311,311,0,392,349,311,0,233,261,0,311,349,311,261,0,233],ctx=this.context,at=ctx.currentTime+.025,note=melody[this.musicStep%melody.length];
        if(note){this.playTone(note,'square',.12,.06,at);if(this.musicStep%4===0)this.playTone(note/2,'triangle',.24,.075,at);}
        this.musicStep=(this.musicStep+1)%melody.length;this.musicTimer=window.setTimeout(()=>this.playMusicStep(),160);
      }
      playTone(frequency,wave,duration,volume,at=this.context&&this.context.currentTime){
        if(!this.context||!this.enabled)return;const ctx=this.context,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(frequency,at);gain.gain.setValueAtTime(Math.max(.0001,volume),at);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain);gain.connect(this.master);osc.start(at);osc.stop(at+duration+.02);
      }
      getNoiseBuffer(){if(this.noiseBuffer)return this.noiseBuffer;const ctx=this.context,buffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;this.noiseBuffer=buffer;return buffer;}
      noise(duration,volume,frequency,at=this.context&&this.context.currentTime){
        if(!this.context||!this.enabled)return;const ctx=this.context,source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=this.getNoiseBuffer();filter.type='lowpass';filter.frequency.setValueAtTime(frequency,at);filter.frequency.exponentialRampToValueAtTime(Math.max(80,frequency*.22),at+duration);gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);source.connect(filter);filter.connect(gain);gain.connect(this.master);source.start(at);source.stop(at+duration+.02);
      }
      shootShell(){if(!this.context||!this.enabled)return;const at=this.context.currentTime;this.noise(.09,.18,2600,at);this.playTone(125,'triangle',.12,.13,at);}
      shootMissile(){if(!this.context||!this.enabled)return;const at=this.context.currentTime;this.noise(.34,.13,1800,at);this.playTone(240,'sawtooth',.3,.055,at);}
      airplane(){
        if(!this.context||!this.enabled)return;const ctx=this.context,at=ctx.currentTime,osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
        osc.type='sawtooth';osc.frequency.setValueAtTime(165,at);osc.frequency.exponentialRampToValueAtTime(72,at+1.5);
        filter.type='lowpass';filter.frequency.setValueAtTime(950,at);filter.frequency.exponentialRampToValueAtTime(240,at+1.5);
        gain.gain.setValueAtTime(.0001,at);gain.gain.linearRampToValueAtTime(.09,at+.16);gain.gain.exponentialRampToValueAtTime(.0001,at+1.55);

        this.armorDrops=this.armorDrops.filter(item=>item!==drop);
      }
      spawnMapRocketLauncherDrops(){
        const count=Phaser.Math.Between(0,2);
        for(let i=0;i<count;i++){
          let x=0,y=0,placed=false;
          for(let attempt=0;attempt<80&&!placed;attempt++){
            x=Phaser.Math.Between(Math.floor(this.arena.left+32),Math.floor(this.arena.right-32));y=Phaser.Math.Between(Math.floor(this.arena.top+32),Math.floor(this.arena.bottom-32));
            const clearWalls=this.wallsGroup.getChildren().every(w=>!w.active||Phaser.Math.Distance.Between(x,y,w.x,w.y)>52);
            const clearTanks=this.tanks.getChildren().every(t=>!t.active||Phaser.Math.Distance.Between(x,y,t.x,t.y)>62);
            const clearDrops=this.rocketLauncherDrops.every(drop=>!drop.sprite.active||Phaser.Math.Distance.Between(x,y,drop.sprite.x,drop.sprite.y)>52);
            if(clearWalls&&clearTanks&&clearDrops)placed=true;
          }
          if(placed)this.spawnRocketLauncherDrop(x,y);
        }
      }
      spawnRocketLauncherDrop(x,y){
        const aura=this.add.circle(x,y,22,0xf97316,.18).setDepth(1.5);
        this.tweens.add({targets:aura,alpha:.4,scale:1.35,duration:650,yoyo:true,repeat:-1});
        const sprite=this.rocketLauncherDropsGroup.create(x,y,'rocket_launcher_drop').setDepth(2).setScale(.9);
        sprite.body.setAllowGravity(false);sprite.body.setImmovable(true);sprite.body.setCircle(13);
        this.tweens.add({targets:sprite,scale:.98,y:y-3,duration:550,yoyo:true,repeat:-1,ease:'Sine.InOut'});
        const drop={sprite,aura,expires:this.time.now+Phaser.Math.Between(10000,15000)};sprite.dropData=drop;this.rocketLauncherDrops.push(drop);
      }
      removeRocketLauncherDrop(drop){
        if(!drop)return;this.tweens.killTweensOf(drop.aura);this.tweens.killTweensOf(drop.sprite);if(drop.aura&&drop.aura.active)drop.aura.destroy();
        if(drop.sprite&&drop.sprite.active)drop.sprite.destroy();
      }
      checkRocketLauncherDropPickups(){
        for(const drop of [...this.rocketLauncherDrops]){
          if(!drop.sprite.active)continue;
          for(const tank of this.tanks.getChildren()){
            if(!tank.active)continue;
            const a=tank.body,b=drop.sprite.body;if(!a||!b)continue;
            if(Phaser.Geom.Intersects.RectangleToRectangle(new Phaser.Geom.Rectangle(a.x,a.y,a.width,a.height),new Phaser.Geom.Rectangle(b.x,b.y,b.width,b.height)))this.onRocketLauncherDropOverlap(tank,drop.sprite);
          }
        }
      }
      onRocketLauncherDropOverlap(tank,sprite){
        const drop=sprite&&sprite.dropData;if(!drop||!tank||!tank.active||!sprite.active)return;
        if(this.time.now>=drop.expires){this.removeRocketLauncherDrop(drop);this.rocketLauncherDrops=this.rocketLauncherDrops.filter(item=>item!==drop);return;}
        this.removeRocketLauncherDrop(drop);this.rocketLauncherDrops=this.rocketLauncherDrops.filter(item=>item!==drop);this.launchRocketBarrage(tank);
      }
      launchRocketBarrage(ownerTank){
        gameAudio.airplane();
        for(let i=0;i<5;i++){
          const x=Phaser.Math.FloatBetween(this.arena.left+14,this.arena.right-14),y=Phaser.Math.FloatBetween(this.arena.top+14,this.arena.bottom-14),delay=i*85;
          this.time.delayedCall(delay,()=>{
            if(!this.sys.isActive())return;
            const rocket=this.add.image(x,this.arena.top+8,'missile').setDepth(9).setRotation(Math.PI/2).setScale(.8).setTint(0xffae55);
            const duration=Phaser.Math.Clamp((y-(this.arena.top+8))*.48,180,420);
            this.tweens.add({targets:rocket,y,duration,ease:'Quad.In',onComplete:()=>{
              if(!rocket.active)return;rocket.destroy();this.createExplosionEffect(x,y,false);
              this.resolveMissileBlast(x,y,Phaser.Math.Between(40,50),ownerTank,true);
            }});
          });
        }
      }
      checkArmorDropPickups(){
        for(const drop of [...this.armorDrops]){
          if(!drop.sprite.active)continue;
          for(const tank of this.tanks.getChildren()){
            if(!tank.active)continue;
            const a=tank.body,b=drop.sprite.body;if(!a||!b)continue;
            if(Phaser.Geom.Intersects.RectangleToRectangle(new Phaser.Geom.Rectangle(a.x,a.y,a.width,a.height),new Phaser.Geom.Rectangle(b.x,b.y,b.width,b.height)))this.onArmorDropOverlap(tank,drop.sprite);
          }
        }
      }
      onMissileHitWall(missile){if(missile.active)this.explodeMissile(missile);}
      onTankHit(first,second){
        // Arcade overlap callbacks can arrive in either order for group-vs-sprite pairs.
        // Identify the projectile by its owner tag instead of assuming argument order.
        const projectile=first&&first.owner!==undefined?first:second;
        const tank=projectile===first?second:first;
        if(!projectile||!tank||!projectile.active||!tank.active||projectile.ownerTank===tank)return;
        if(projectile.texture&&projectile.texture.key==='missile'){this.explodeMissile(projectile,tank);return;}
        const damage=projectile.damage,attacker=projectile.ownerTank;this.hitSpark(projectile.x,projectile.y,0xffb347);projectile.destroy();this.damageTank(tank,damage,attacker);
      }
      explodeMissile(missile,directTank=null){
        if(!missile.active)return;const {x,y}=missile;missile.destroy();this.createExplosionEffect(x,y,false);
        this.resolveMissileBlast(x,y,missile.damage,missile.ownerTank,false);
      }
      resolveMissileBlast(x,y,damage,ownerTank,includeOwner){
        const radius=90;
        this.wallsGroup.children.each(w=>{if(w.active&&Phaser.Math.Distance.Between(x,y,w.x,w.y)<=radius)this.destroyWall(w,false);});
        this.tanks.getChildren().forEach(t=>{if(t&&t.active&&(includeOwner||t!==ownerTank)){const d=Phaser.Math.Distance.Between(x,y,t.x,t.y);if(d<=radius){const falloff=Math.max(.35,1-d/radius);this.damageTank(t,Math.round(damage*falloff),ownerTank);}}});
      }
      damageTank(tank,damage,attacker=null){
        if(this.roundOver||!tank.active)return;
        if(tank.isEnemy&&attacker&&attacker.isEnemy&&attacker.active)tank.target=attacker;
        const absorbed=Math.min(tank.armor,damage);tank.armor-=absorbed;tank.hp-=damage-absorbed;tank.hp=Math.max(0,tank.hp);tank.setTint(0xff6a52);
        this.time.delayedCall(110,()=>{if(tank.active)tank.clearTint();});
        if(tank.hp<=0){tank.hp=0;this.createExplosionEffect(tank.x,tank.y,true);tank.worldHud.setVisible(false);if(tank.shadow)tank.shadow.setVisible(false);this.leaveWreck(tank);tank.setActive(false).setVisible(false);tank.body.enable=false;
          if(matchState.mode==='solo'&&tank.isEnemy){if(this.enemies.every(enemy=>!enemy.active)){this.roundOver=true;this.time.delayedCall(850,()=>{matchState.round++;matchState.highestRound=Math.max(matchState.highestRound,matchState.round);this.scene.restart();});}}
          else{this.roundOver=true;this.time.delayedCall(1100,()=>this.endRound(tank.player===1?2:1));}
        }
      }
      createExplosionEffect(x,y,big){
        gameAudio.explosion(big);this.cameras.main.shake(big?420:180,big?.006:.003);
        const k=big?1:.6,ADD=Phaser.BlendModes.ADD;
        this.stampDecal('scorch',x,y,big?1.5:.85,Phaser.Math.Between(0,360),big?.9:.7);
        const flash=this.add.image(x,y,'puff').setTint(0xfff3c0).setBlendMode(ADD).setDepth(9).setScale(.4);
        this.tweens.add({targets:flash,scale:big?4:2.2,alpha:0,duration:big?300:200,onComplete:()=>flash.destroy()});
        const ring=this.add.circle(x,y,5).setStrokeStyle(big?3:2,0xffe3a0,.85).setDepth(8);ring.isFilled=false;
        this.tweens.add({targets:ring,radius:big?96:50,alpha:0,duration:big?460:280,ease:'Cubic.Out',onComplete:()=>ring.destroy()});
        for(let i=0;i<(big?10:6);i++){
          const a=Math.random()*Math.PI*2,d=Phaser.Math.Between(8,big?60:34),tint=Phaser.Utils.Array.GetRandom([0xffd24a,0xff9a2e,0xff6a1a,0xff4a12]);
          const f=this.add.image(x,y,'puff').setTint(tint).setBlendMode(ADD).setDepth(8).setScale(.3).setAlpha(.9);
          this.tweens.add({targets:f,x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,scale:Phaser.Math.FloatBetween(.9,1.5)*(big?1.5:1),alpha:0,duration:Phaser.Math.Between(350,650),onComplete:()=>f.destroy()});
        }
        for(let i=0;i<(big?9:4);i++){
          const a=Math.random()*Math.PI*2,d=Phaser.Math.Between(10,big?55:30),sm=this.add.image(x,y,'puff').setTint(i%2?0x2b2724:0x4a4540).setDepth(8.5).setScale(.35).setAlpha(0);
          this.tweens.add({targets:sm,x:x+Math.cos(a)*d,y:y+Math.sin(a)*d-Phaser.Math.Between(14,40),scale:Phaser.Math.FloatBetween(1.1,2)*(big?1.4:1),alpha:{from:.6,to:0},delay:Phaser.Math.Between(60,200),duration:Phaser.Math.Between(900,1500),onComplete:()=>sm.destroy()});
        }
        for(let i=0;i<(big?26:12);i++){
          const a=Math.random()*Math.PI*2,sp=Phaser.Math.Between(60,big?280:170),len=Phaser.Math.Between(2,6),p=this.add.rectangle(x,y,len,2,i%2?0xffb347:0xffe08a).setDepth(9).setRotation(a).setBlendMode(ADD);
          this.tweens.add({targets:p,x:x+Math.cos(a)*sp*.6,y:y+Math.sin(a)*sp*.6+14,alpha:0,scaleX:.3,duration:Phaser.Math.Between(300,650),ease:'Quad.Out',onComplete:()=>p.destroy()});
        }
        if(big)for(let i=0;i<8;i++){
          const a=Math.random()*Math.PI*2,sp=Phaser.Math.Between(50,130),c=this.add.rectangle(x,y,Phaser.Math.Between(3,6),Phaser.Math.Between(3,6),0x2a2a28).setDepth(8);
          this.tweens.add({targets:c,x:x+Math.cos(a)*sp,y:y+Math.sin(a)*sp,angle:Phaser.Math.Between(-360,360),alpha:0,duration:Phaser.Math.Between(500,900),ease:'Quad.Out',onComplete:()=>c.destroy()});
        }
      }
      muzzleFlash(pos,rotation,missile){
        const ADD=Phaser.BlendModes.ADD,f=this.add.image(pos.x,pos.y,'puff').setTint(missile?0xffc27a:0xffe9a0).setBlendMode(ADD).setDepth(9).setScale(missile?.5:.3).setAlpha(.95);
        this.tweens.add({targets:f,scale:missile?1.3:.8,alpha:0,duration:missile?170:100,onComplete:()=>f.destroy()});
        for(let i=0;i<(missile?4:2);i++){const a=rotation+Phaser.Math.FloatBetween(-.5,.5),sm=this.add.image(pos.x,pos.y,'puff').setTint(0x77736c).setDepth(8.5).setScale(.15).setAlpha(.4);
          this.tweens.add({targets:sm,x:pos.x+Math.cos(a)*Phaser.Math.Between(14,34),y:pos.y+Math.sin(a)*Phaser.Math.Between(14,34),scale:missile?.7:.45,alpha:0,duration:500,onComplete:()=>sm.destroy()});}
      }
      missileTrail(m){
        const bx=m.x-Math.cos(m.rotation)*15,by=m.y-Math.sin(m.rotation)*15;
        const sm=this.add.image(bx,by,'puff').setTint(0xb9b4aa).setDepth(3.5).setScale(.14).setAlpha(.45);
        this.tweens.add({targets:sm,scale:.55,alpha:0,duration:650,onComplete:()=>sm.destroy()});
        const fl=this.add.image(bx,by,'puff').setTint(0xffa040).setBlendMode(Phaser.BlendModes.ADD).setDepth(3.6).setScale(.2).setAlpha(.8);
        this.tweens.add({targets:fl,scale:.04,alpha:0,duration:160,onComplete:()=>fl.destroy()});
      }
      hitSpark(x,y,color){
        for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,sp=Phaser.Math.Between(14,34),p=this.add.rectangle(x,y,3,1.5,color).setDepth(9).setRotation(a).setBlendMode(Phaser.BlendModes.ADD);
          this.tweens.add({targets:p,x:x+Math.cos(a)*sp,y:y+Math.sin(a)*sp,alpha:0,duration:Phaser.Math.Between(150,280),onComplete:()=>p.destroy()});}
        const g=this.add.image(x,y,'puff').setTint(color).setBlendMode(Phaser.BlendModes.ADD).setDepth(9).setScale(.35);
        this.tweens.add({targets:g,scale:.7,alpha:0,duration:130,onComplete:()=>g.destroy()});
      }
      leaveWreck(tank){
        this.stampDecal('scorch',tank.x,tank.y,1.9,Phaser.Math.Between(0,360),.85);
        this.decals.stamp(tank.texture.key,undefined,tank.x,tank.y,{angle:tank.angle,tint:0x2b2926,alpha:.95});
        const tick=()=>{if(!this.sys.isActive())return;const sm=this.add.image(tank.x+Phaser.Math.Between(-10,10),tank.y+Phaser.Math.Between(-8,8),'puff').setTint(0x3a3631).setDepth(8.5).setScale(.3).setAlpha(.5);
          this.tweens.add({targets:sm,y:sm.y-50,x:sm.x+Phaser.Math.Between(-12,12),scale:1.3,alpha:0,duration:1600,onComplete:()=>sm.destroy()});};
        this.time.addEvent({delay:260,repeat:14,callback:tick});
      }
      endRound(winner){if(matchState.mode==='solo'){this.scene.start('GameOverScene',{solo:true,highestRound:matchState.highestRound});return;}if(winner===1)matchState.p1Score++;else matchState.p2Score++;if(matchState.p1Score>=3||matchState.p2Score>=3)this.scene.start('GameOverScene',{winner});else this.scene.restart();}
    }

    class GameOverScene extends Phaser.Scene {
      constructor(){super('GameOverScene');}
      init(data){this.winner=data&&data.winner;this.solo=!!(data&&data.solo);this.highestRound=(data&&data.highestRound)||matchState.highestRound;}
      create(){gameAudio.startMusic();const w=this.w=this.scale.width,h=this.h=this.scale.height;this.scale.on('resize',this.handleResize,this);this.events.once(Phaser.Scenes.Events.SHUTDOWN,()=>this.scale.off('resize',this.handleResize,this));this.cameras.main.setBackgroundColor('#101820');buildSharedTextures(this);drawBackdrop(this,w,h);
        const title=this.solo?'RUN OVER':`PLAYER ${this.winner} WINS!`;
        this.add.text(w/2,h*.3,title,{font:`${Math.min(28,w/35)}px ${FONT}`,color:'#facc15',stroke:'#713f12',strokeThickness:6}).setOrigin(.5).setShadow(0,5,'#000000',8,true,true);
        const detail=this.solo?`HIGHEST ROUND REACHED: ${this.highestRound}`:`FINAL SCORE   ${matchState.p1Score} — ${matchState.p2Score}`;
        this.add.text(w/2,h*.4,detail,{font:`${Math.max(9,w/90)}px ${FONT}`,color:'#d4dde0'}).setOrigin(.5);
        drawButton(this,w/2,h*.58,Math.min(340,w*.55),52,this.solo?'TRY AGAIN':'REMATCH',0x276b42,()=>{matchState.p1Score=0;matchState.p2Score=0;matchState.round=1;matchState.highestRound=1;this.scene.start('GameScene');},11);
        drawButton(this,w/2,h*.7,Math.min(340,w*.55),52,'MAIN MENU',0x344b58,()=>this.scene.start('MenuScene'),11);
      }
      handleResize(size){if(size.width!==this.w||size.height!==this.h)this.scene.restart({winner:this.winner,solo:this.solo,highestRound:this.highestRound});}
    }

    const game=new Phaser.Game({
      type:Phaser.AUTO,parent:'game-container',backgroundColor:'#101820',
      scale:{mode:Phaser.Scale.RESIZE,width:window.innerWidth,height:window.innerHeight},
      physics:{default:'arcade',arcade:{gravity:{x:0,y:0},debug:false}},
      render:{antialias:true,pixelArt:false,roundPixels:false},scene:[MenuScene,GameScene,GameOverScene]
    });
    document.getElementById('fullscreen').addEventListener('click',async()=>{
      try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){}
    });
    document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'EXIT FULL':'FULLSCREEN';});
  </script>
</body>
